<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagrant Infrastructure Lab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 650px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 16px;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid #22c55e;
            border-radius: 8px;
            color: #4ade80;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Vagrant Infrastructure Lab</h1>

        <p>
            Welcome to our Docker Swarm application.
            This application is deployed across a three-node
            infrastructure using Docker Stack.
        </p>

        <div class="status">
            Infrastructure Status: Running
        </div>
    </main>
</body>
</html>
